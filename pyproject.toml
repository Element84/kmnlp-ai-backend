[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "llm-agent"
authors = []
maintainers = []
description = ""
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "boto3>=1.35.20",
  "boto3-stubs[bedrock-runtime]>=1.35.20",
  "pydantic>=2.9.1",
  "e84-geoai-common @ git+https://github.com/Element84/e84-geoai-common",
  "natural-language-geocoding==0.0.3",
  "rastervision_pipeline @ git+https://github.com/azavea/raster-vision#egg=$rastervision_pipeline&subdirectory=rastervision_pipeline",
  "rastervision_core @ git+https://github.com/azavea/raster-vision#egg=$rastervision_core&subdirectory=rastervision_core",
  "rich",
  "triangle==20250106",
  "rdflib>=7.1.3",
]
dynamic = ["version"]

[tool.setuptools.package-data]
llm_agent = ["data/*.ttl"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
markers = ["integration: test that requires making network calls to an LLM"]
asyncio_default_fixture_loop_scope = "function"

[project.urls]
Gitlab = "https://repo.element84.com/noaa_km_nlp/llm-agent"

[project.optional-dependencies]
debugging = ["folium>=0.17.0"]
testing = [
  "pytest>=8.3.3",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.9",
  "pyright>=1.1.394",
]
dev = [
  "appnope>=0.1.4", # Required for Jupyter on OS X
  "build>=1.2.2",
  "debugpy",
  "ipykernel>=6.29.5",
  "ipython>=8.28.0",
  "ipywidgets>=8.1.5",
  "jupyterlab>=4.3.3",
  "pre-commit-hooks>=4.6.0",
  "pre-commit>=3.8.0",
  "pyinstrument>=5.0.2",
]
data_processing = [
  "bokeh>=3.1.0",
  "cartopy",
  "contextily",
  "dask[distributed]",
  "fsspec>=2024.12.0",
  "s3fs>=2024.12.0",
  "geopandas",
  "h5netcdf",
  "h5py",
  "kerchunk",
  "lat_lon_parser",
  "matplotlib",
  "netCDF4",
  "numpy",
  "pandas",
  "pydap",
  "rasterio",
  "rioxarray",
  "seaborn",
  "shapely",
  "tqdm",
  "virtualizarr",
  "xarray",
  # constraining because of https://github.com/zarr-developers/zarr-python/issues/2706
  "zarr<3",
]

[tool.pyright]
include = ["src/"]
ignore = ["**/venv/**", "*.pyc"]
typeCheckingMode = "strict"
reportGeneralTypeIssues = true
reportImplicitStringConcatenation = "none"
reportPropertyTypeMismatch = "error"
reportShadowedImports = "error"
reportTypedDictNotRequiredAccess = "none"
reportUninitializedInstanceVariable = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnnecessaryComparison = "error"
reportIncompatibleVariableOverride = "none"


[tool.ruff]
line-length = 79
extend-exclude = ["notebooks/", ".history/"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
# http://docs.astral.sh/ruff/rules/
select = ["ALL"]
ignore = [
  # Unnecessary assignment before return statement
  "RET504",
  # Trailing comma missing
  "COM812",
  # Missing docstring for module
  "D100",
  # Missing docstring in magic method
  "D105",
  # 1 blank line required before class docstring
  "D203",
  # Multi-line docstring summary should start at the second line
  "D213",
  # TODO comment missing author name
  "TD002",
  # TODO comment missing issue link
  "TD003",
  # comment contains TODO
  "FIX002",
  # comment contains HACK
  "FIX004",
  # recommendations to use Path over os.path -- ignoring because Path does not
  # work with S3 URIs
  "PTH",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  # Module level import not at top of cell
  "E402",
  # Imported but unused
  "F401",
]
"tests/**/*" = [
  # Use of assert detected
  "S101",
  # Missing return type annotation for public function
  "ANN201",
  # Missing docstrings
  "D1",
  # Private member accessed
  "SLF001",
  # magic values
  "PLR2004",
]

[dependency-groups]
dev = [
]
