<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval Report Viewer</title>
<style>
  :root, html[data-theme="light"] {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #eef0f3;
    --border: #d8dce2;
    --text: #1c1f26;
    --muted: #6b7280;
    --accent: #2f6fed;
    --good: #1a9c6b;
    --bad: #d43d3d;
    --warn: #b5790a;
    --selected-bg: #dce7fb;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  html[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d2129;
    --border: #2a2f3a;
    --text: #e4e6ea;
    --muted: #8a90a0;
    --accent: #5b9dff;
    --good: #3ecf8e;
    --bad: #ff6b6b;
    --warn: #f5b642;
    --selected-bg: #232a3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  header {
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    white-space: nowrap;
  }
  .file-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
  }
  .btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); }
  .file-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 3px 6px 3px 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .file-chip .x {
    cursor: pointer;
    color: var(--muted);
    border-radius: 50%;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .file-chip .x:hover { background: var(--bad); color: white; }
  #dropzone {
    margin: 40px auto;
    max-width: 640px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
  }
  #dropzone.drag { border-color: var(--accent); color: var(--accent); }
  nav.tabs {
    display: flex;
    gap: 4px;
    padding: 8px 16px 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  nav.tabs button {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
  }
  nav.tabs button.active {
    color: var(--text);
    background: var(--bg);
    font-weight: 600;
  }
  main { padding: 16px; }
  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 18px 0 8px 0;
    font-weight: 600;
  }
  .section-label:first-child { margin-top: 0; }
  .section-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 18px 0 8px 0;
  }
  .section-label-row .section-label { margin: 0; }
  .seg-control {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .seg-btn {
    background: var(--panel-2);
    border: none;
    border-left: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  .seg-btn:first-child { border-left: none; }
  .seg-btn.active { background: var(--accent); color: #fff; }
  .subsection-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 10px 0 4px 0;
  }
  table.tbl {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    margin-bottom: 8px;
  }
  table.tbl th, table.tbl td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    vertical-align: top;
  }
  table.tbl th {
    background: var(--panel-2);
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
  }
  .muted { color: var(--muted); }
  .problem-statement {
    font-size: 15px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 4px;
  }
  .cases-layout { display: flex; gap: 16px; align-items: flex-start; }
  #caseSidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  #caseSearch {
    width: 100%;
    padding: 8px 10px;
    background: var(--panel-2);
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
  }
  #caseList { max-height: 78vh; overflow-y: auto; }
  .case-item {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .case-item:hover { background: var(--panel-2); }
  .case-item.selected { background: var(--selected-bg); }
  .case-id { font-size: 12px; font-family: var(--mono); word-break: break-all; }
  .case-dots { display: flex; gap: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .dot.good { background: var(--good); }
  .dot.bad { background: var(--bad); }
  .dot.warn { background: var(--warn); }
  #caseDetail { flex: 1; min-width: 0; }
  .ref-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .ref-idx { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
  .exp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 12px;
  }
  .exp-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    min-width: 0;
  }
  .exp-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .exp-label { font-weight: 600; font-size: 13px; }
  .status { font-size: 11px; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .status.good { background: rgba(62,207,142,0.15); color: var(--good); }
  .status.bad { background: rgba(255,107,107,0.15); color: var(--bad); }
  .status.warn { background: rgba(245,182,66,0.15); color: var(--warn); }
  .status.na { background: rgba(138,144,160,0.15); color: var(--muted); }
  .metrics-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .chip {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    white-space: nowrap;
  }
  .chip.good { border-color: var(--good); color: var(--good); }
  .chip.bad { border-color: var(--bad); color: var(--bad); }
  .chip.warn { border-color: var(--warn); color: var(--warn); }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .badge.refusal { background: rgba(245,182,66,0.15); color: var(--warn); }
  .badge.bad { background: rgba(255,107,107,0.15); color: var(--bad); }
  .errmsg { font-size: 13px; margin-bottom: 8px; }
  details.block {
    margin-bottom: 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
  }
  details.block summary {
    cursor: pointer;
    padding: 5px 9px;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  details.block p, details.block pre { padding: 0 9px 9px 9px; margin: 0; }
  details.block p { white-space: pre-wrap; font-size: 13px; }
  pre {
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }
  pre.raw { max-height: 200px; overflow: auto; }
  .algo {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    overflow-x: auto;
  }
  .stmt { padding: 3px 0; white-space: pre-wrap; word-break: break-word; }
  .stmt-desc { color: var(--muted); font-family: -apple-system, sans-serif; font-size: 11px; margin: 0 0 4px 0; }
  .varname { color: var(--accent); }
  .fnname { color: #d78ef2; }
  .varref { color: var(--good); font-style: italic; }
  .argname { color: var(--muted); }
  .lit.str { color: #f0b25a; }
  .outvars { font-size: 12px; color: var(--muted); }
  .outvars .chip { color: var(--good); border-color: var(--good); margin-right: 4px; }
  .generic-list { margin: 2px 0; padding-left: 18px; font-size: 13px; }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }
</style>
</head>
<body>
<header>
  <h1>Eval Report Viewer</h1>
  <div class="file-controls">
    <button class="btn" id="addFilesBtn">+ Add JSON file(s)</button>
    <input type="file" id="fileInput" accept="application/json,.json" multiple hidden>
    <span id="fileChips"></span>
    <button class="btn" id="clearAllBtn" style="display:none;">Clear all</button>
  </div>
  <button class="btn" id="themeToggleBtn">Dark mode</button>
</header>
<nav class="tabs" id="tabs" style="display:none;">
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="cases">Cases</button>
</nav>
<main id="content">
  <div id="dropzone">
    Drop one or more eval report JSON files here<br>
    (e.g. <code>evals/outputs/.../1.json</code> or <code>aggregated.json</code>)<br>
    or use "Add JSON file(s)" above.<br><br>
    Load multiple files (different experiments or repeated runs) to compare them side by side.
  </div>
</main>

<script>
(function () {
  "use strict";

  /** @type {{expId:string, fileName:string, label:string, config:object, data:object}[]} */
  let experiments = [];
  let activeTab = "overview";
  let selectedCaseId = null;
  let caseFilter = "";
  let nextId = 1;
  let errorMode = "sd"; // "sd" | "se" | "ci"

  const content = document.getElementById("content");
  const tabsNav = document.getElementById("tabs");
  const fileChipsEl = document.getElementById("fileChips");
  const clearAllBtn = document.getElementById("clearAllBtn");
  const fileInput = document.getElementById("fileInput");
  const themeToggleBtn = document.getElementById("themeToggleBtn");

  // ---------- Theme ----------

  const THEME_KEY = "eval-viewer-theme";

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeToggleBtn.textContent = theme === "dark" ? "Light mode" : "Dark mode";
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* ignore storage errors */ }
  }

  function initTheme() {
    let theme = "light";
    try {
      const stored = localStorage.getItem(THEME_KEY);
      if (stored === "light" || stored === "dark") theme = stored;
    } catch (e) { /* ignore storage errors */ }
    applyTheme(theme);
  }

  themeToggleBtn.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    applyTheme(current === "dark" ? "light" : "dark");
  });

  initTheme();

  // ---------- Utilities ----------

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function round2(n) {
    if (typeof n !== "number" || Number.isNaN(n)) return n;
    return Math.round(n * 100) / 100;
  }

  function formatNumber(n) {
    if (typeof n !== "number" || Number.isNaN(n)) return String(n);
    return round2(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
  }

  // Two-tailed 95% critical values for small degrees of freedom; falls back to the
  // normal-approximation z-value (1.96) once df is large enough for it to be accurate.
  const T_TABLE_95 = {
    1: 12.706, 2: 4.303, 3: 3.182, 4: 2.776, 5: 2.571, 6: 2.447, 7: 2.365, 8: 2.306,
    9: 2.262, 10: 2.228, 11: 2.201, 12: 2.179, 13: 2.16, 14: 2.145, 15: 2.131,
    20: 2.086, 25: 2.06, 30: 2.042,
  };

  function tCritical95(df) {
    if (df in T_TABLE_95) return T_TABLE_95[df];
    if (df > 30) return 1.96;
    const keys = Object.keys(T_TABLE_95).map(Number).sort((a, b) => a - b);
    let best = 1.96;
    keys.forEach((k) => { if (df >= k) best = T_TABLE_95[k]; });
    return best;
  }

  function shortName(url) {
    if (!url || typeof url !== "string") return url || "";
    const parts = url.split("/");
    return parts[parts.length - 1];
  }

  // ---------- File loading ----------

  function addFiles(fileList) {
    const files = Array.from(fileList || []);
    let pending = files.length;
    if (!pending) return;
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || typeof data !== "object" || !data.experiment_config) {
            throw new Error("Not a recognized eval report (missing experiment_config).");
          }
          experiments.push({
            expId: "exp" + nextId++,
            fileName: file.name,
            label: data.experiment_config.name || file.name,
            config: data.experiment_config,
            data,
          });
        } catch (e) {
          alert("Failed to load " + file.name + ": " + e.message);
        } finally {
          pending -= 1;
          if (pending === 0) {
            relabelExperiments();
            if (!selectedCaseId) {
              const cases = collectCases();
              if (cases.length) selectedCaseId = cases[0].id;
            }
            render();
          }
        }
      };
      reader.onerror = () => {
        alert("Failed to read file " + file.name);
        pending -= 1;
        if (pending === 0) render();
      };
      reader.readAsText(file);
    });
  }

  function relabelExperiments() {
    const counts = {};
    experiments.forEach((e) => {
      const n = e.config.name || e.fileName;
      counts[n] = (counts[n] || 0) + 1;
    });
    const seen = {};
    experiments.forEach((e) => {
      const n = e.config.name || e.fileName;
      if (counts[n] > 1) {
        seen[n] = (seen[n] || 0) + 1;
        e.label = n + " #" + seen[n] + " (" + e.fileName + ")";
      } else {
        e.label = n;
      }
    });
  }

  function removeExperiment(expId) {
    experiments = experiments.filter((e) => e.expId !== expId);
    relabelExperiments();
    render();
  }

  function clearAll() {
    experiments = [];
    selectedCaseId = null;
    caseFilter = "";
    render();
  }

  // ---------- Data helpers ----------

  function getReferenceSolutions(evalInput) {
    const ref = evalInput.reference_output;
    if (ref && Array.isArray(ref.solutions)) return ref.solutions;
    return [ref];
  }

  function collectCases() {
    const map = new Map();
    experiments.forEach((exp) => {
      const results = exp.data.results;
      if (!Array.isArray(results)) return;
      results.forEach((r) => {
        const id = r.input && r.input.id;
        if (id === undefined || id === null) return;
        if (!map.has(id)) {
          map.set(id, { id, input: r.input, results: {} });
        }
        map.get(id).results[exp.expId] = r;
      });
    });
    return Array.from(map.values());
  }

  function statusForResult(r, refAttrs) {
    if (!r) return { cls: "na", label: "no data" };
    const m = r.metrics || {};
    const output = r.output;
    if (output && output.failed_output !== undefined) return { cls: "bad", label: "parse failure" };
    if (m.format_compliant === false || m.schema_compliant === false) {
      return { cls: "bad", label: "invalid" };
    }
    const expectedRefusal = refAttrs ? refAttrs.is_refusal : undefined;
    if (expectedRefusal !== undefined && m.is_refusal !== undefined && m.is_refusal !== null
        && expectedRefusal !== m.is_refusal) {
      return { cls: "bad", label: "refusal mismatch" };
    }
    const missing = m.missing_ops || [];
    const extra = m.extra_ops || [];
    if (missing.length || extra.length) return { cls: "warn", label: "ops differ" };
    return { cls: "good", label: "match" };
  }

  // ---------- Rendering: shared expression pretty-printer ----------

  function exprHtml(value) {
    if (value === null || value === undefined) return '<span class="lit">null</span>';
    if (typeof value === "string") return '<span class="lit str">"' + esc(value) + '"</span>';
    if (typeof value === "number" || typeof value === "boolean") {
      return '<span class="lit">' + esc(String(value)) + "</span>";
    }
    if (Array.isArray(value)) {
      return "[" + value.map(exprHtml).join(", ") + "]";
    }
    if (typeof value === "object") {
      if (value.type === "VariableReference") {
        return '<span class="varref">' + esc(value.name) + "</span>";
      }
      if (value.type === "FunctionCall" && value.func) {
        return exprHtml(value.func);
      }
      const callName = value.func_name || value.spec_name;
      if (callName) {
        const skip = { type: true, func_name: true, spec_name: true };
        const args = Object.entries(value).filter(([k]) => !skip[k]);
        const argsHtml = args
          .map(([k, v]) => '<span class="argname">' + esc(k) + "</span>=" + exprHtml(v))
          .join(", ");
        return '<span class="fnname">' + esc(callName) + "</span>(" + argsHtml + ")";
      }
      const entries = Object.entries(value).filter(([k]) => k !== "type");
      if (entries.length === 0) return "{}";
      const inner = entries
        .map(([k, v]) => '<span class="argname">' + esc(k) + "</span>: " + exprHtml(v))
        .join(", ");
      return "{" + inner + "}";
    }
    return esc(String(value));
  }

  function stmtHtml(stmt) {
    const desc = stmt.description
      ? '<div class="stmt-desc">' + esc(stmt.description) + "</div>"
      : "";
    return (
      '<div class="stmt"><span class="varname">' + esc(stmt.name) + "</span> = " +
      exprHtml(stmt.value) + "</div>" + desc
    );
  }

  function genericHtml(value) {
    if (value === null || value === undefined) return '<span class="muted">null</span>';
    if (typeof value !== "object") return esc(String(value));
    if (Array.isArray(value)) {
      if (value.length === 0) return '<span class="muted">[]</span>';
      return '<ul class="generic-list">' + value.map((v) => "<li>" + genericHtml(v) + "</li>").join("") + "</ul>";
    }
    const entries = Object.entries(value);
    if (entries.length === 0) return '<span class="muted">{}</span>';
    return (
      '<ul class="generic-list">' +
      entries.map(([k, v]) => "<li><span class=\"argname\">" + esc(k) + ":</span> " + genericHtml(v) + "</li>").join("") +
      "</ul>"
    );
  }

  function detailsBlock(label, text, isCode, open) {
    if (!text) return "";
    const body = isCode
      ? "<pre>" + esc(text) + "</pre>"
      : "<p>" + esc(text) + "</p>";
    return (
      '<details class="block"' + (open ? " open" : "") + "><summary>" + esc(label) + "</summary>" + body + "</details>"
    );
  }

  function renderSolution(sol) {
    if (!sol) return '<div class="muted">No data</div>';
    if (sol.failed_output !== undefined) {
      const raw = typeof sol.failed_output === "string"
        ? sol.failed_output
        : JSON.stringify(sol.failed_output, null, 2);
      return (
        '<div class="badge bad">Parsing Failure</div>' +
        '<div class="errmsg">' + esc(sol.error_message || "") + "</div>" +
        (raw ? '<details class="block"><summary>Raw output</summary><pre class="raw">' + esc(raw) + "</pre></details>" : "")
      );
    }
    const hasStatements = sol.algorithm && Array.isArray(sol.algorithm.statements) && sol.algorithm.statements.length;
    const isRefusal = !!sol.error_message && !hasStatements;
    let html = "";
    if (isRefusal) {
      html += '<div class="badge refusal">Refusal</div><div class="errmsg">' + esc(sol.error_message) + "</div>";
    }
    html += detailsBlock("Analysis", sol.analysis, false, false);
    html += detailsBlock("Pseudocode", sol.pseudocode, true, false);
    if (hasStatements) {
      html += '<div class="subsection-label">Algorithm</div><div class="algo">' +
        sol.algorithm.statements.map(stmtHtml).join("") + "</div>";
      if (sol.algorithm.output_variables && sol.algorithm.output_variables.length) {
        html += '<div class="outvars">Outputs: ' +
          sol.algorithm.output_variables.map((v) => '<span class="chip">' + esc(v.name) + "</span>").join(" ") +
          "</div>";
      }
    }
    html += detailsBlock("Explanation", sol.explanation, false, false);
    if (!isRefusal && sol.error_message) {
      html += detailsBlock("Error", sol.error_message, false, true);
    }
    return html;
  }

  function chip(val, label) {
    if (val === null || val === undefined) return "";
    return '<span class="chip ' + (val ? "good" : "bad") + '">' + esc(label) + ": " + esc(String(val)) + "</span>";
  }

  function metricsHtml(m, refIsRefusal) {
    if (!m) return "";
    const chips = [];
    chips.push(chip(m.format_compliant, "format"));
    chips.push(chip(m.schema_compliant, "schema"));
    if (m.is_refusal !== null && m.is_refusal !== undefined) {
      let cls = "";
      if (refIsRefusal !== undefined && refIsRefusal !== null) {
        cls = m.is_refusal === refIsRefusal ? "good" : "bad";
      }
      chips.push('<span class="chip ' + cls + '">refusal: ' + esc(String(m.is_refusal)) + "</span>");
    }
    if (m.statement_count_diff !== null && m.statement_count_diff !== undefined) {
      chips.push('<span class="chip ' + (m.statement_count_diff === 0 ? "good" : "warn") + '">stmt &Delta; ' + esc(String(m.statement_count_diff)) + "</span>");
    }
    if (m.output_variables_count_diff !== null && m.output_variables_count_diff !== undefined) {
      chips.push('<span class="chip ' + (m.output_variables_count_diff === 0 ? "good" : "warn") + '">outvar &Delta; ' + esc(String(m.output_variables_count_diff)) + "</span>");
    }
    if (m.missing_ops && m.missing_ops.length) {
      chips.push('<span class="chip bad">missing: ' + esc(m.missing_ops.join(", ")) + "</span>");
    }
    if (m.extra_ops && m.extra_ops.length) {
      chips.push('<span class="chip warn">extra: ' + esc(m.extra_ops.join(", ")) + "</span>");
    }
    return chips.filter(Boolean).join(" ");
  }

  // ---------- Rendering: problem ----------

  function problemHtml(p) {
    if (!p) return "";
    if (p.statement !== undefined) {
      let html = '<div class="section-label">Problem</div><div class="problem-statement">' + esc(p.statement) + "</div>";
      if (Array.isArray(p.inputs_provided) && p.inputs_provided.length) {
        html += '<div class="subsection-label">Inputs Provided</div><table class="tbl"><thead><tr>' +
          "<th>Name</th><th>Type</th><th>Standard Name / Units</th><th>Dimensions</th><th>Coverage</th></tr></thead><tbody>";
        html += p.inputs_provided.map((v) => {
          const dims = Array.isArray(v.dimensions) ? v.dimensions.map((d) => esc(d.field_name || d.id)).join(", ") : "";
          const coverage = (v.spatial_coverage || "") +
            (Array.isArray(v.temporal_coverage) && v.temporal_coverage.length === 2
              ? " (" + esc(v.temporal_coverage[0]) + " to " + esc(v.temporal_coverage[1]) + ")"
              : "");
          return "<tr><td>" + esc(v.name) + "</td><td>" + esc(v.variable_type) + "</td><td>" +
            esc(shortName(v.standard_name)) + (v.units ? " / " + esc(v.units) : "") + "</td><td>" +
            dims + "</td><td>" + coverage + "</td></tr>";
        }).join("");
        html += "</tbody></table>";
      }
      if (Array.isArray(p.outputs_requested) && p.outputs_requested.length) {
        html += '<div class="subsection-label">Outputs Requested</div><table class="tbl"><thead><tr>' +
          "<th>Name</th><th>Type</th><th>Description</th></tr></thead><tbody>";
        html += p.outputs_requested.map((o) =>
          "<tr><td>" + esc(o.name) + "</td><td>" + esc(o.variable_type) + "</td><td>" + esc(o.description || "") + "</td></tr>"
        ).join("");
        html += "</tbody></table>";
      }
      return html;
    }
    return '<div class="section-label">Problem</div>' + genericHtml(p);
  }

  // ---------- Rendering: overview tab ----------

  function configTable() {
    const paramKeys = Array.from(new Set(experiments.flatMap((e) => Object.keys(e.config.params || {}))));
    let html = '<table class="tbl"><thead><tr><th>Experiment</th><th>Dataset</th>' +
      paramKeys.map((k) => "<th>" + esc(k) + "</th>").join("") + "</tr></thead><tbody>";
    experiments.forEach((e) => {
      html += "<tr><td>" + esc(e.label) + "</td><td>" + esc(e.config.dataset_id) + " v" + esc(e.config.dataset_version) + "</td>" +
        paramKeys.map((k) => {
          const params = e.config.params || {};
          const has = Object.prototype.hasOwnProperty.call(params, k);
          return "<td>" + (has ? esc(JSON.stringify(params[k])) : "") + "</td>";
        }).join("") + "</tr>";
    });
    html += "</tbody></table>";
    return html;
  }

  function formatMetricValue(v) {
    if (v === undefined || v === null) return "";
    if (typeof v === "number") return esc(formatNumber(v));
    if (Array.isArray(v)) return esc(v.map((x) => (typeof x === "number" ? formatNumber(x) : x)).join(", "));
    if (typeof v === "object" && "mean" in v) {
      const n = Array.isArray(v.values) ? v.values.length : undefined;
      let errorValue = v.std;
      if (n && n >= 2) {
        const se = v.std / Math.sqrt(n);
        if (errorMode === "se") errorValue = se;
        else if (errorMode === "ci") errorValue = se * tCritical95(n - 1);
      }
      return formatNumber(v.mean) + " &plusmn; " + formatNumber(errorValue) +
        ' <span class="muted">[' + formatNumber(v.min) + "&ndash;" + formatNumber(v.max) + "]</span>";
    }
    if (typeof v === "object") return esc(JSON.stringify(v));
    return esc(String(v));
  }

  function metricsTable() {
    const keys = Array.from(new Set(experiments.flatMap((e) => Object.keys(e.data.aggregated_metrics || {}))));
    let html = '<table class="tbl"><thead><tr><th>Metric</th>' +
      experiments.map((e) => "<th>" + esc(e.label) + "</th>").join("") + "</tr></thead><tbody>";
    keys.forEach((k) => {
      html += "<tr><td>" + esc(k) + "</td>" +
        experiments.map((e) => {
          const am = e.data.aggregated_metrics || {};
          return "<td>" + formatMetricValue(am[k]) + "</td>";
        }).join("") + "</tr>";
    });
    html += "</tbody></table>";
    return html;
  }

  function errorModeToggleHtml() {
    const options = [["sd", "SD"], ["se", "SE"], ["ci", "95% CI"]];
    const buttons = options.map(([val, label]) =>
      '<button class="seg-btn' + (errorMode === val ? " active" : "") + '" data-action="set-error-mode" data-mode="' + val + '">' + label + "</button>"
    ).join("");
    return '<div class="section-label-row"><span class="section-label">Aggregated Metrics</span>' +
      '<span class="seg-control" title="Error stat shown for mean values across runs">' + buttons + "</span></div>";
  }

  function renderOverview() {
    return (
      '<div class="section-label">Experiment Configs</div>' + configTable() +
      errorModeToggleHtml() + metricsTable()
    );
  }

  // ---------- Rendering: cases tab ----------

  function renderCaseList(cases) {
    const filterLower = caseFilter.trim().toLowerCase();
    const filtered = cases.filter((c) => {
      if (!filterLower) return true;
      const statement = (c.input.input && c.input.input.statement) || "";
      return c.id.toLowerCase().includes(filterLower) || statement.toLowerCase().includes(filterLower);
    });
    if (!filtered.length) return '<div class="muted" style="padding:10px;">No matching cases.</div>';
    return filtered.map((c) => {
      const dots = experiments.map((exp) => {
        const r = c.results[exp.expId];
        const s = statusForResult(r, c.input.attrs);
        return '<span class="dot ' + s.cls + '" title="' + esc(exp.label) + ": " + esc(s.label) + '"></span>';
      }).join("");
      return (
        '<div class="case-item' + (c.id === selectedCaseId ? " selected" : "") + '" data-action="select-case" data-id="' + esc(c.id) + '">' +
        '<div class="case-id">' + esc(c.id) + "</div>" +
        '<div class="case-dots">' + dots + "</div>" +
        "</div>"
      );
    }).join("");
  }

  function renderCaseDetail(caseObj) {
    if (!caseObj) return '<div class="empty-state">Select a case from the list.</div>';
    const refSolutions = getReferenceSolutions(caseObj.input);
    let html = problemHtml(caseObj.input.input);
    html += '<div class="section-label">Reference Solution' + (refSolutions.length > 1 ? "s" : "") + "</div>";
    html += refSolutions.map((s, i) =>
      '<div class="ref-card">' + (refSolutions.length > 1 ? '<div class="ref-idx">Option ' + (i + 1) + "</div>" : "") +
      renderSolution(s) + "</div>"
    ).join("");
    html += '<div class="section-label">Generated Solutions</div><div class="exp-grid">';
    experiments.forEach((exp) => {
      const r = caseObj.results[exp.expId];
      const status = statusForResult(r, caseObj.input.attrs);
      html += '<div class="exp-card"><div class="exp-card-header"><span class="exp-label">' + esc(exp.label) +
        '</span><span class="status ' + status.cls + '">' + esc(status.label) + "</span></div>";
      if (r) {
        html += '<div class="metrics-row">' + metricsHtml(r.metrics, caseObj.input.attrs && caseObj.input.attrs.is_refusal) + "</div>";
        html += renderSolution(r.output);
      } else {
        html += '<div class="muted">No result for this case</div>';
      }
      html += "</div>";
    });
    html += "</div>";
    return html;
  }

  function renderCases() {
    const cases = collectCases();
    if (!cases.length) {
      return '<div class="empty-state">No per-case results found in the loaded file(s). ' +
        "(Aggregated-only reports don&#39;t include individual cases.)</div>";
    }
    const selected = cases.find((c) => c.id === selectedCaseId) || cases[0];
    return (
      '<div class="cases-layout">' +
      '<div id="caseSidebar">' +
      '<input id="caseSearch" type="text" placeholder="Filter cases..." value="' + esc(caseFilter) + '">' +
      '<div id="caseList">' + renderCaseList(cases) + "</div>" +
      "</div>" +
      '<div id="caseDetail">' + renderCaseDetail(selected) + "</div>" +
      "</div>"
    );
  }

  // ---------- Top-level render ----------

  function renderFileChips() {
    fileChipsEl.innerHTML = experiments.map((e) =>
      '<span class="file-chip">' + esc(e.label) +
      '<span class="x" data-action="remove-file" data-id="' + esc(e.expId) + '">&times;</span></span>'
    ).join("");
    clearAllBtn.style.display = experiments.length ? "inline-block" : "none";
  }

  function render() {
    renderFileChips();
    if (!experiments.length) {
      tabsNav.style.display = "none";
      content.innerHTML =
        '<div id="dropzone">' +
        "Drop one or more eval report JSON files here<br>" +
        "(e.g. <code>evals/outputs/.../1.json</code> or <code>aggregated.json</code>)<br>" +
        'or use "Add JSON file(s)" above.<br><br>' +
        "Load multiple files (different experiments or repeated runs) to compare them side by side." +
        "</div>";
      wireDropzone();
      return;
    }
    tabsNav.style.display = "flex";
    Array.from(tabsNav.querySelectorAll("button")).forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.tab === activeTab);
    });
    const searchWasFocused = document.activeElement && document.activeElement.id === "caseSearch";
    const prevCaseListEl = document.getElementById("caseList");
    const prevCaseListScroll = prevCaseListEl ? prevCaseListEl.scrollTop : undefined;
    content.innerHTML = activeTab === "overview" ? renderOverview() : renderCases();
    if (activeTab === "cases") {
      const searchEl = document.getElementById("caseSearch");
      if (searchEl && searchWasFocused) {
        searchEl.focus();
        searchEl.selectionStart = searchEl.selectionEnd = searchEl.value.length;
      }
      const caseListEl = document.getElementById("caseList");
      if (caseListEl && prevCaseListScroll !== undefined) {
        caseListEl.scrollTop = prevCaseListScroll;
      }
    }
  }

  function wireDropzone() {
    const dz = document.getElementById("dropzone");
    if (!dz) return;
    dz.addEventListener("dragover", (ev) => { ev.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
    dz.addEventListener("drop", (ev) => {
      ev.preventDefault();
      dz.classList.remove("drag");
      addFiles(ev.dataTransfer.files);
    });
  }

  // ---------- Event wiring (delegated, attached once) ----------

  document.getElementById("addFilesBtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (ev) => {
    addFiles(ev.target.files);
    fileInput.value = "";
  });
  clearAllBtn.addEventListener("click", clearAll);

  tabsNav.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-tab]");
    if (!btn) return;
    activeTab = btn.dataset.tab;
    render();
  });

  document.body.addEventListener("dragover", (ev) => {
    if (!experiments.length) return;
    ev.preventDefault();
  });
  document.body.addEventListener("drop", (ev) => {
    if (!experiments.length) return;
    ev.preventDefault();
    addFiles(ev.dataTransfer.files);
  });

  content.addEventListener("click", (ev) => {
    const removeBtn = ev.target.closest('[data-action="remove-file"]');
    if (removeBtn) {
      removeExperiment(removeBtn.dataset.id);
      return;
    }
    const errorModeBtn = ev.target.closest('[data-action="set-error-mode"]');
    if (errorModeBtn) {
      errorMode = errorModeBtn.dataset.mode;
      render();
      return;
    }
    const caseItem = ev.target.closest('[data-action="select-case"]');
    if (caseItem) {
      selectedCaseId = caseItem.dataset.id;
      render();
    }
  });

  content.addEventListener("input", (ev) => {
    if (ev.target && ev.target.id === "caseSearch") {
      caseFilter = ev.target.value;
      render();
    }
  });

  fileChipsEl.addEventListener("click", (ev) => {
    const removeBtn = ev.target.closest('[data-action="remove-file"]');
    if (removeBtn) removeExperiment(removeBtn.dataset.id);
  });

  wireDropzone();
})();
</script>
</body>
</html>
