# Trigger a job to update dependency in demo-app
trigger_dependendee_update:
  stage: side_effecting
  trigger:
    project: noaa_km_nlp/kmnlp-api
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
