image: quay.io/element84/e84-build-python:3.12-main

stages:
  - test
  - side_effecting

# Define a unit test job
unit_tests:
  stage: test
  script:
    - pip3.12 install uv
    - uv sync --all-extras
    - source .venv/bin/activate
    - ./scripts/test.sh
  only:
    - merge_requests
    - main

# Define a linting job
lint:
  stage: test
  script:
    - pip3.12 install uv
    - uv sync --all-extras
    - source .venv/bin/activate
    - ./scripts/lint.sh
  only:
    - merge_requests
    - main

# Define an integration test job
integration_tests:
  stage: test
  script:
    - pip3.12 install uv
    - uv sync --all-extras
    - source .venv/bin/activate
    - . scripts/assume_role_ci.sh
    - ./scripts/integration_tests.sh
  only:
    - merge_requests
    - main

